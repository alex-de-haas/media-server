# Keeps dependencies current and surfaces security advisories across every ecosystem here:
# the Next.js web app (npm), the .NET API (nuget), both Dockerfiles, and the CI actions.
#
# Grouping policy for the package ecosystems (npm, nuget): minor and patch bumps arrive as
# one weekly PR so routine churn costs a single review, while majors arrive individually
# because each needs its own judgement call and must not block the rest of the group.
# Actions group wholesale, majors included -- an action major is normally a mechanical
# `@v4 -> @v5` bump rather than a migration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    groups:
      # The Hosty App SDK gets its own group so a release reaches this repo on its own
      # merit — the platform's update model (docs/ideas/hosty-app-sdk.md, decision 13)
      # expects SDK bumps to flow continuously rather than wait behind an unrelated
      # failing dependency. It is also the group to enable auto-merge on first.
      # Note: @hosty-sdk/app is pre-1.0, so a 0.1.x -> 0.2.0 release is a semver-MINOR
      # bump that no `^0.1` range can reach on its own; this group is what delivers it.
      # Restricted to minor/patch on purpose: when auto-merge is enabled on this group,
      # a future 1.0 major must not ride in on it. A major falls outside the group and
      # arrives as its own reviewable PR, which is the intended handling.
      hosty-sdk:
        patterns: ["@hosty-sdk/*"]
        update-types: ["minor", "patch"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["@hosty-sdk/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: nuget
    directories:
      - /src/api/MediaServer.Api
      - /src/api/MediaServer.Api.Tests
    schedule:
      interval: weekly
    groups:
      # Same rationale as the npm hosty-sdk group above — HostySdk.App is the .NET half
      # of the same SDK and follows the same release cadence.
      hosty-sdk:
        patterns: ["HostySdk.*"]
        update-types: ["minor", "patch"]
      nuget:
        patterns: ["*"]
        exclude-patterns: ["HostySdk.*"]
        update-types: ["minor", "patch"]
    ignore:
      # Cap Microsoft.OpenApi at the 2.x line: upstream aligns its major versions with
      # ASP.NET Core (microsoft/OpenAPI.NET CONTRIBUTING.md, "Branches and support
      # policy"), where 2.x is the line for AspNetCore OpenAPI 10 and 3.x is listed as
      # "not available" for any released AspNetCore OpenAPI. The API is a net10.0 app, so
      # 3.x is not merely untested here but uncompilable: the Microsoft.AspNetCore.OpenApi
      # 10 source generator emits an assignment to IOpenApiMediaType.Example, which 3.x
      # made read-only (CS0200 — see the failing build on PR #180). Raise this bound in
      # lockstep with the target framework once an AspNetCore OpenAPI release adopts 3.x.
      # The bound is written as a NuGet range: Dependabot parses the ecosystem's own
      # requirement syntax first, so `[3.0.0,)` needs no cross-syntax fallback.
      - dependency-name: "Microsoft.OpenApi"
        versions: ["[3.0.0,)"]

  - package-ecosystem: docker
    directories:
      - /src/web
      - /src/api
    schedule:
      interval: weekly
