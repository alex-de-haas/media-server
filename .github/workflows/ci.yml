name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # The build regenerates the OpenAPI document for /native/v1. If it differs from what is
      # committed, a route changed without the contract being refreshed — and the generated Swift
      # client would drift from the server.
      - name: OpenAPI document is current
        run: |
          if ! git diff --exit-code -- openapi; then
            echo "::error::The /native/v1 OpenAPI document is stale. Run 'dotnet build' in src/api and commit src/api/openapi." >&2
            exit 1
          fi

      # The Swift client is generated from that document and committed. This runs on Linux and the
      # generator needs a Mac, so the check is a recorded hash rather than a regeneration: if the
      # document moved and nobody reran the script, the two disagree here instead of on a television.
      - name: Generated Swift client is current
        working-directory: .
        run: |
          stamp=src/apple/MediaKit/Sources/MediaServerAPI/GeneratedSources/.openapi-sha256
          expected=$(sha256sum src/api/openapi/MediaServer.Api_native.json | cut -d' ' -f1)
          if [ ! -f "$stamp" ] || [ "$(cat "$stamp")" != "$expected" ]; then
            echo "::error::The generated Swift client is stale. Run scripts/generate-apple-client.sh on a Mac and commit the result." >&2
            exit 1
          fi

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: "11.7.0"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  web-e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: "11.7.0"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2e (mocked BFF)
        run: pnpm exec playwright test

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate manifest structure and dev runtime commands
        run: bash scripts/validate-manifest.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check docs index and headers
        run: node scripts/docs-index.mjs --check
